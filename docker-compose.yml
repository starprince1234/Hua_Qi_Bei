name: HUAQIBEI

services:
  backend:
    build:
      context: ./backend/huaqibei/oil-risk-orchestrator
      dockerfile: docker/Dockerfile
    ports:
      - "18000:8000"
    environment:
      - MODE=prod
      - API_KEY=${API_KEY:-}
      - USE_MOCK_MODEL=${USE_MOCK_MODEL:-false}
      - MODEL_API_URL=${MODEL_API_URL:-http://host.docker.internal:6006/v1}
      - MODEL_API_TIMEOUT=${MODEL_API_TIMEOUT:-120}
      - MODEL_API_MAX_RETRIES=${MODEL_API_MAX_RETRIES:-2}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_API_MODEL_ID=${MODEL_API_MODEL_ID:-oil_vol_model}
      - LLM_PROVIDER=${LLM_PROVIDER:-siliconflow}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-Pro/deepseek-ai/DeepSeek-V3.2}
      - LLM_JSON_MODE=${LLM_JSON_MODE:-true}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-false}
      - LLM_THINKING_BUDGET=${LLM_THINKING_BUDGET:-4096}
      - LLM_TOP_P=${LLM_TOP_P:-0.7}
      - LLM_TOP_K=${LLM_TOP_K:-50}
      - LLM_FREQUENCY_PENALTY=${LLM_FREQUENCY_PENALTY:-0.2}
      - DATABASE_URL=${DATABASE_URL:-}
      - NEWS_PROVIDER=${NEWS_PROVIDER:-mock}
      - NEWS_REFRESH_INTERVAL_MINUTES=${NEWS_REFRESH_INTERVAL_MINUTES:-30}
      - GDELT_BIGQUERY_PROJECT_ID=${GDELT_BIGQUERY_PROJECT_ID:-}
      - GDELT_GOOGLE_CREDENTIALS_JSON=${GDELT_GOOGLE_CREDENTIALS_JSON:-}
      - GDELT_BIGQUERY_MAX_BYTES_BILLED=${GDELT_BIGQUERY_MAX_BYTES_BILLED:-1073741824}
      - NEWSAPI_API_KEY=${NEWSAPI_API_KEY:-}
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:18000
    ports:
      - "${FRONTEND_PORT:-13289}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18000
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
