name: Deploy Production

on:
  push:
    branches:
      - main
      - local-huaqibei-backup-20260524
  workflow_dispatch:

concurrency:
  group: huaqibei-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
      CI_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Install SSH helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Build and deploy over SSH
        shell: bash
        run: |
          set -euo pipefail

          secrets_json="$(doppler secrets download --project huaqibei --config prd --format=json --no-file --no-fallback)"
          export SECRETS_JSON="$secrets_json"
          get_secret() {
            python3 -c 'import json, os, sys; print(json.loads(os.environ["SECRETS_JSON"]).get(sys.argv[1], ""))' "$1"
          }

          DEPLOY_HOST="$(get_secret DEPLOY_HOST)"
          DEPLOY_USER="$(get_secret DEPLOY_USER)"
          DEPLOY_PASSWORD="$(get_secret DEPLOY_PASSWORD)"
          DEPLOY_PORT="$(get_secret DEPLOY_PORT)"
          BACKEND_TAG="$(get_secret BACKEND_TAG)"
          FRONTEND_TAG="$(get_secret FRONTEND_TAG)"
          NEXT_PUBLIC_API_URL="$(get_secret NEXT_PUBLIC_API_URL)"
          : "${DEPLOY_PORT:=22}"
          : "${BACKEND_TAG:=prd}"
          : "${FRONTEND_TAG:=prd}"
          : "${NEXT_PUBLIC_API_URL:=/api}"

          : "${DEPLOY_HOST:?DEPLOY_HOST is required in Doppler prd}"
          : "${DEPLOY_USER:?DEPLOY_USER is required in Doppler prd}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD is required in Doppler prd}"

          docker build \
            -t "huaqibei-backend:${BACKEND_TAG}" \
            -f backend/huaqibei/oil-risk-orchestrator/docker/Dockerfile \
            backend/huaqibei/oil-risk-orchestrator

          docker build \
            -t "huaqibei-frontend:${FRONTEND_TAG}" \
            --build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            -f frontend/Dockerfile \
            frontend

          docker pull "metacubex/mihomo:v1.19.27"

          docker save \
            "huaqibei-backend:${BACKEND_TAG}" \
            "huaqibei-frontend:${FRONTEND_TAG}" \
            "metacubex/mihomo:v1.19.27" \
            -o /tmp/huaqibei-images.tar

          secrets_b64="$(printf '%s' "$secrets_json" | base64 -w 0)"
          sshpass -p "$DEPLOY_PASSWORD" scp \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -P "$DEPLOY_PORT" \
            /tmp/huaqibei-images.tar \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/huaqibei-images.tar"

          printf -v remote_env 'DOPPLER_SECRETS_JSON_B64=%q IMAGE_ARCHIVE=%q' \
            "$secrets_b64" "/tmp/huaqibei-images.tar"
          sshpass -p "$DEPLOY_PASSWORD" ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_env bash -s" < deploy/production/deploy-from-github.sh
