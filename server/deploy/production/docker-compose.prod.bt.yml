name: HUAQIBEI_PROD

services:
  backend:
    image: starprince123/huaqibei-backend:${BACKEND_TAG:-v1}
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - USE_MOCK_MODEL=false
      - MODEL_API_URL=${MODEL_API_URL}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_API_MODEL_ID=${MODEL_API_MODEL_ID:-oil_vol_model}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      - huaqibei-net

  frontend:
    image: starprince123/huaqibei-frontend:${FRONTEND_TAG:-v1}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    networks:
      - huaqibei-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - huaqibei-net

networks:
  huaqibei-net:
    driver: bridge
