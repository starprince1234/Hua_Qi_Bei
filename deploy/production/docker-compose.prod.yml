name: HUAQIBEI_PROD

services:
  backend:
    image: huaqibei-backend:${BACKEND_TAG:-prd}
    build:
      context: ../../backend/huaqibei/oil-risk-orchestrator
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - USE_MOCK_MODEL=${USE_MOCK_MODEL:-false}
      - MODEL_API_URL=${MODEL_API_URL}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_API_MODEL_ID=${MODEL_API_MODEL_ID:-oil_vol_model}
      - MODEL_API_TIMEOUT=${MODEL_API_TIMEOUT:-120}
      - MODEL_API_MAX_RETRIES=${MODEL_API_MAX_RETRIES:-2}
      - LLM_PROVIDER=${LLM_PROVIDER:-siliconflow}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-Pro/deepseek-ai/DeepSeek-V3.2}
      - LLM_JSON_MODE=${LLM_JSON_MODE:-true}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-false}
      - LLM_THINKING_BUDGET=${LLM_THINKING_BUDGET:-4096}
      - LLM_TOP_P=${LLM_TOP_P:-0.7}
      - LLM_TOP_K=${LLM_TOP_K:-50}
      - LLM_FREQUENCY_PENALTY=${LLM_FREQUENCY_PENALTY:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1500}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-1}
      - DATABASE_URL=${DATABASE_URL:-}
      - NEWS_PROVIDER=${NEWS_PROVIDER:-hybrid}
      - NEWS_REFRESH_INTERVAL_MINUTES=${NEWS_REFRESH_INTERVAL_MINUTES:-30}
      - GDELT_BIGQUERY_PROJECT_ID=${GDELT_BIGQUERY_PROJECT_ID:-}
      - GDELT_GOOGLE_CREDENTIALS_JSON=${GDELT_GOOGLE_CREDENTIALS_JSON:-}
      - GDELT_BIGQUERY_MAX_BYTES_BILLED=${GDELT_BIGQUERY_MAX_BYTES_BILLED:-1073741824}
      - NEWSAPI_API_KEY=${NEWSAPI_API_KEY:-}
      - HTTP_PROXY=${HTTP_PROXY:-http://mihomo:7890}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://mihomo:7890}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,backend,frontend,nginx,mihomo}
      - http_proxy=${HTTP_PROXY:-http://mihomo:7890}
      - https_proxy=${HTTPS_PROXY:-http://mihomo:7890}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,backend,frontend,nginx,mihomo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      - huaqibei-net
    depends_on:
      - mihomo

  frontend:
    image: huaqibei-frontend:${FRONTEND_TAG:-prd}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    networks:
      - huaqibei-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HOST_HTTP_BIND:-127.0.0.1}:${HOST_HTTP_PORT:-18080}:80"
      - "${HOST_HTTPS_BIND:-127.0.0.1}:${HOST_HTTPS_PORT:-18443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    networks:
      - huaqibei-net

  mihomo:
    image: metacubex/mihomo:${MIHOMO_TAG:-v1.19.27}
    restart: unless-stopped
    command: ["-d", "/mihomo", "-f", "/mihomo/config.docker.yaml"]
    volumes:
      - ${MIHOMO_CONFIG_DIR:-/opt/mihomo}:/mihomo:ro
    expose:
      - "7890"
    networks:
      - huaqibei-net

networks:
  huaqibei-net:
    driver: bridge
